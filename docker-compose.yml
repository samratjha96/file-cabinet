version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - CORS_ORIGIN=http://localhost:3000
      - NODE_ENV=production
      # AWS credentials will be discovered automatically from:
      # - Host environment variables
      # - ~/.aws/credentials (if mounted)
      # - IAM roles (if running on AWS)
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend 