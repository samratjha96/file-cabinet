services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    env_file:
      - ./.env
    environment:
      - CORS_ORIGIN=http://localhost:${FRONTEND_PORT:-3000}
      - NODE_ENV=production

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-3001}
    depends_on:
      - backend
